# Configuration de Pages CMS (https://app.pagescms.org) :
# l'interface en ligne pour écrire les histoires depuis un téléphone ou un navigateur.

media:
  - name: photos
    label: Photos
    input: contenu/photos
    output: photos
    categories: [image]
    rename: safe

content:
  - name: histoires
    label: Histoires
    type: collection
    path: contenu/histoires
    format: yaml-frontmatter
    subfolders: false
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [titre, date, lieu]
      primary: titre
      sort: [date, titre]
      default:
        sort: date
        order: desc
    fields:
      - name: titre
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: lieu
        label: Lieu
        type: string
        description: "Facultatif. Exemple : De Leh à Padum"
      - name: resume
        label: Résumé
        type: text
        description: "Facultatif. Une ou deux phrases pour la vignette de l'accueil. Sans résumé, le premier paragraphe est utilisé."
        options:
          maxlength: 300
      - name: duree
        label: Durée
        type: string
        description: "Facultatif. Exemple : 8 jours"
      - name: altitude
        label: Altitude max
        type: string
        description: "Facultatif. Exemple : 5 090 m"
      - name: difficulte
        label: Difficulté
        type: select
        options:
          values: [Facile, Modérée, Soutenue, Difficile]
          placeholder: "Facultatif"
      - name: couverture
        label: Photo de couverture
        type: image
        description: "La photo affichée en grand en haut de l'histoire et sur la vignette."
        options:
          media: photos
      - name: body
        label: Introduction
        type: text
        description: "Le texte d'ouverture, avant les étapes. Laissez une ligne vide entre deux paragraphes. **gras** et *italique* sont possibles."
      - name: etapes
        label: Étapes du voyage
        type: object
        description: "Le carnet de route : ajoutez une étape avec le bouton +, puis son texte et ses photos. Les étapes peuvent être réordonnées."
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {titre}"
        fields:
          - name: titre
            label: Titre de l'étape
            type: string
            required: true
          - name: jour
            label: Jour
            type: string
            description: "Facultatif. Exemple : Jour 1"
          - name: temps
            label: Temps de marche
            type: string
            description: "Facultatif. Exemple : 5 h"
          - name: altitude
            label: Altitude max
            type: string
            description: "Facultatif. Exemple : 3 750 m"
          - name: denivele_positif
            label: Dénivelé positif (D+)
            type: string
            description: "Facultatif. Exemple : 650 m. Le total du trek est calculé tout seul si chaque étape a un dénivelé."
          - name: denivele_negatif
            label: Dénivelé négatif (D−)
            type: string
            description: "Facultatif. Exemple : 400 m"
          - name: texte
            label: Récit de l'étape
            type: text
            description: "Laissez une ligne vide entre deux paragraphes. **gras** et *italique* sont possibles."
          - name: photos
            label: Photos de l'étape
            type: object
            description: "1 photo s'affiche en grand, 2 côte à côte, 3 et plus en mosaïque."
            list:
              collapsible:
                collapsed: false
                summary: "Photo {index}"
            fields:
              - name: image
                label: Photo
                type: image
                required: true
                options:
                  media: photos
              - name: legende
                label: Légende
                type: string
                description: "Facultatif. Une courte phrase sous la photo."
      - name: galerie
        label: Autres photos (fin de page)
        type: image
        description: "Facultatif. Des photos supplémentaires, affichées en galerie après les étapes."
        options:
          media: photos
          multiple:
            max: 40

  - name: introduction
    label: Accueil (introduction)
    type: file
    path: contenu/accueil/introduction.txt
    format: raw

  - name: contact
    label: Page Contact
    type: file
    path: contenu/accueil/contact.txt
    format: raw
